<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KEMAL TV - CANLI ODA</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* Oda içi ekstra düzenlemeler */
        body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        #video-container { height: 30%; background: #000; border-bottom: 2px solid #ef4444; }
        #chat-section { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        #msgs { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 10px 15px; border-radius: 15px; max-width: 80%; font-size: 14px; position: relative; }
        .msg-me { align-self: flex-end; background: #ef4444; color: white; }
        .msg-other { align-self: flex-start; background: #1e293b; color: white; }
        .admin-badge { background: #ffd700; color: #000; font-size: 9px; padding: 2px 5px; border-radius: 4px; font-weight: bold; margin-bottom: 3px; display: inline-block; }
        #controls { padding: 15px; background: #161d2f; display: flex; gap: 10px; align-items: center; }
        #m-input { flex: 1; padding: 12px; border-radius: 10px; border: none; background: #0b0f1a; color: white; outline: none; }
        .btn-action { width: 45px; height: 45px; border-radius: 50%; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .mic-off { background: #334155; color: white; }
        .mic-on { background: #10b981; color: white; box-shadow: 0 0 15px #10b981; }
    </style>
</head>
<body>

<div id="video-container">
    <div id="player" style="height:100%; display:flex; align-items:center; justify-content:center; color:#94a3b8; font-size:12px;">Link bekleniyor...</div>
</div>

<div id="chat-section">
    <div id="msgs"></div>
    <audio id="remote-audio" autoplay playsinline></audio>
    <div id="controls">
        <button id="mic-btn" class="btn-action mic-off" onclick="toggleVoice()"><i class="fas fa-microphone"></i></button>
        <input type="text" id="m-input" placeholder="Mesaj veya YouTube...">
        <button onclick="sendMsg()" style="background:none; border:none; color:#ef4444; font-size:24px;"><i class="fas fa-paper-plane"></i></button>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyC9R9X3FxqgNQ5kWerDmLRSyijbnquoRzg",
        authDomain: "kemaltv-95504.firebaseapp.com",
        databaseURL: "https://kemaltv-95504-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "kemaltv-95504",
        storageBucket: "kemaltv-95504.firebasestorage.app",
        messagingSenderId: "1061917735137",
        appId: "1:1061917735137:web:5d95ceef5fe479094b9fa0"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Giriş ekranından gelen bilgileri al
    const myName = localStorage.getItem('kemal_user') || 'Misafir';
    const myRoom = 'genel'; // Şimdilik tek oda üzerinden gidelim

    // Mesajları ve Videoyu Dinle
    db.ref('rooms/' + myRoom + '/chats').on('child_added', snap => {
        const d = snap.val();
        displayMessage(d);
        if(d.t.includes('youtube.com/') || d.t.includes('youtu.be/')) loadYT(d.t);
    });

    function sendMsg() {
        const inp = document.getElementById('m-input');
        if(!inp.value.trim()) return;
        const isAdmin = (myName.toLowerCase() === 'kemal'); // Admin kontrolü
        db.ref('rooms/' + myRoom + '/chats').push({ u: myName, t: inp.value, admin: isAdmin });
        inp.value = '';
    }

    function displayMessage(d) {
        const div = document.createElement('div');
        div.className = `msg ${d.u === myName ? 'msg-me' : 'msg-other'}`;
        let badge = d.admin ? `<span class="admin-badge">YÖNETİCİ</span><br>` : '';
        div.innerHTML = `${badge}<small style="font-size:10px; opacity:0.7;">${d.u}</small><br>${d.t}`;
        document.getElementById('msgs').appendChild(div);
        document.getElementById('msgs').scrollTop = document.getElementById('msgs').scrollHeight;
    }

    function loadYT(url) {
        let id = url.includes('v=') ? url.split('v=')[1].split('&')[0] : url.split('youtu.be/')[1].split('?')[0];
        document.getElementById('player').innerHTML = `<iframe src="https://www.youtube.com/embed/${id}?autoplay=1" width="100%" height="100%" frameborder="0" allow="autoplay; fullscreen"></iframe>`;
    }

    // --- WEB RTC ANLIK SES KODLARI ---
    let localStream, pc;
    const servers = { iceServers: [{ urls: ["stun:stun1.l.google.com:19302", "stun:stun2.l.google.com:19302"] }] };

    async function toggleVoice() {
        const btn = document.getElementById('mic-btn');
        if(!localStream) {
            localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            btn.className = "btn-action mic-on";
            initPC();
            localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            db.ref('rooms/'+myRoom+'/webrtc').push({ u: myName, type: 'offer', sdp: offer });
        } else {
            localStream.getTracks().forEach(t => t.stop());
            localStream = null;
            btn.className = "btn-action mic-off";
        }
    }

    function initPC() {
        pc = new RTCPeerConnection(servers);
        pc.onicecandidate = e => {
            if(e.candidate) db.ref('rooms/'+myRoom+'/webrtc').push({ u: myName, type: 'candidate', candidate: e.candidate });
        };
        pc.ontrack = e => { document.getElementById('remote-audio').srcObject = e.streams[0]; };
    }

    db.ref('rooms/'+myRoom+'/webrtc').on('child_added', async snap => {
        const data = snap.val();
        if(data.u !== myName) {
            if(data.type === 'offer') {
                initPC();
                await pc.setRemoteDescription(new RTCSessionDescription(data.sdp));
                const s = await navigator.mediaDevices.getUserMedia({ audio: true });
                s.getTracks().forEach(t => pc.addTrack(t, s));
                const answer = await pc.createAnswer();
                await pc.setLocalDescription(answer);
                db.ref('rooms/'+myRoom+'/webrtc').push({ u: myName, type: 'answer', sdp: answer });
            } else if(data.type === 'answer') pc.setRemoteDescription(new RTCSessionDescription(data.sdp));
            else if(data.type === 'candidate') pc.addIceCandidate(new RTCIceCandidate(data.candidate));
        }
    });
</script>
</body>
    </html>
