<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KEMAL TV - CANLI</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background: #0b0f1a; color: white; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* Video Alanı %30 Sabit */
        #video-section { height: 35%; background: #000; border-bottom: 2px solid #ef4444; position: relative; }
        iframe { width: 100%; height: 100%; border: none; }

        /* Sohbet Alanı Geri Kalan %65 */
        #chat-section { flex: 1; display: flex; flex-direction: column; background: #0f172a; overflow: hidden; }
        #messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 8px; }
        
        .msg { padding: 10px; border-radius: 12px; max-width: 80%; font-size: 14px; line-height: 1.4; }
        .msg-me { align-self: flex-end; background: #ef4444; }
        .msg-other { align-self: flex-start; background: #1e293b; }
        .admin-tag { color: #ffd700; font-weight: bold; font-size: 10px; display: block; margin-bottom: 2px; }

        /* Alt Panel (Mesaj Yazma) */
        #input-panel { padding: 15px; background: #161d2f; display: flex; gap: 10px; align-items: center; }
        input { flex: 1; padding: 12px; border-radius: 25px; border: none; background: #0b0f1a; color: white; outline: none; }
        .btn { width: 45px; height: 45px; border-radius: 50%; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        
        /* Admin Barı */
        #admin-bar { display: none; background: #ffd700; color: black; padding: 5px; text-align: center; font-weight: bold; font-size: 12px; }
    </style>
</head>
<body>

<div id="admin-bar">YÖNETİCİ MODU AKTİF - <span onclick="window.location.href='admin.html'" style="text-decoration:underline; cursor:pointer;">PANELİ AÇ</span></div>

<div id="video-section">
    <div id="player">Link Bekleniyor...</div>
</div>

<div id="chat-section">
    <div id="messages"></div>
    <audio id="remote-audio" autoplay playsinline></audio>
    <div id="input-panel">
        <button id="mic-btn" class="btn" style="background:#334155;" onclick="toggleMic()"><i class="fas fa-microphone"></i></button>
        <input type="text" id="m-input" placeholder="Mesaj veya Link...">
        <button onclick="send()" style="background:none; border:none; color:#ef4444; font-size:24px;"><i class="fas fa-paper-plane"></i></button>
    </div>
</div>

<script>
    // Firebase Ayarları
    const firebaseConfig = {
        apiKey: "AIzaSyC9R9X3FxqgNQ5kWerDmLRSyijbnquoRzg",
        authDomain: "kemaltv-95504.firebaseapp.com",
        databaseURL: "https://kemaltv-95504-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "kemaltv-95504",
        storageBucket: "kemaltv-95504.firebasestorage.app",
        messagingSenderId: "1061917735137",
        appId: "1:1061917735137:web:5d95ceef5fe479094b9fa0"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const myName = localStorage.getItem('kemal_user') || 'Misafir';

    // SÜPER ADMIN KONTROLÜ
    if(myName === 'L.kemal.16') {
        document.getElementById('admin-bar').style.display = 'block';
    }

    db.ref('rooms/genel/chats').on('child_added', snap => {
        const d = snap.val();
        const div = document.createElement('div');
        div.className = `msg ${d.u === myName ? 'msg-me' : 'msg-other'}`;
        const tag = d.u === 'L.kemal.16' ? '<span class="admin-tag">YÖNETİCİ</span>' : '';
        div.innerHTML = `${tag}<small style="opacity:0.6;">${d.u}</small><br>${d.t}`;
        document.getElementById('messages').appendChild(div);
        document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
        if(d.t.includes('youtube.com/') || d.t.includes('youtu.be/')) loadVideo(d.t);
    });

    function send() {
        const i = document.getElementById('m-input');
        if(!i.value.trim()) return;
        db.ref('rooms/genel/chats').push({ u: myName, t: i.value });
        i.value = "";
    }

    function loadVideo(url) {
        let vid = url.includes('v=') ? url.split('v=')[1].split('&')[0] : url.split('youtu.be/')[1].split('?')[0];
        document.getElementById('player').innerHTML = `<iframe src="https://www.youtube.com/embed/${vid}?autoplay=1" allow="autoplay; fullscreen"></iframe>`;
    }
</script>
</body>
</html>
