<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KEMAL TV - Giriş & Kayıt</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <h1 class="logo">KEMAL TV</h1>
        
        <div class="auth-tabs">
            <button id="tab-login" class="active" onclick="toggleAuth('login')">Giriş Yap</button>
            <button id="tab-register" onclick="toggleAuth('register')">Kayıt Ol</button>
        </div>

        <div id="login-form" class="form-box">
            <input type="text" id="log-user" placeholder="Kullanıcı Adı">
            <input type="password" id="log-pass" placeholder="Şifre">
            <button class="btn-primary" onclick="handleAuth('login')">Giriş Yap</button>
        </div>

        <div id="register-form" class="form-box" style="display:none;">
            <input type="text" id="reg-user" placeholder="Yeni Kullanıcı Adı">
            <input type="password" id="reg-pass" placeholder="Yeni Şifre">
            <button class="btn-primary" onclick="handleAuth('register')">Hesap Oluştur</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyC9R9X3FxqgNQ5kWerDmLRSyijbnquoRzg",
            authDomain: "kemaltv-95504.firebaseapp.com",
            databaseURL: "https://kemaltv-95504-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "kemaltv-95504",
            storageBucket: "kemaltv-95504.firebasestorage.app",
            messagingSenderId: "1061917735137",
            appId: "1:1061917735137:web:5d95ceef5fe479094b9fa0"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function toggleAuth(mode) {
            document.getElementById('login-form').style.display = mode === 'login' ? 'block' : 'none';
            document.getElementById('register-form').style.display = mode === 'register' ? 'block' : 'none';
            document.getElementById('tab-login').className = mode === 'login' ? 'active' : '';
            document.getElementById('tab-register').className = mode === 'register' ? 'active' : '';
        }

        function handleAuth(mode) {
            const u = document.getElementById(mode === 'login' ? 'log-user' : 'reg-user').value.trim();
            const p = document.getElementById(mode === 'login' ? 'log-pass' : 'reg-pass').value.trim();

            if(!u || !p) return alert("Boş bırakma Kemal!");

            if(mode === 'register') {
                db.ref('users/' + u).set({ password: p }).then(() => {
                    alert("Kayıt başarılı! Şimdi giriş yapabilirsin.");
                    toggleAuth('login');
                });
            } else {
                db.ref('users/' + u).once('value').then(snap => {
                    if(snap.exists() && snap.val().password === p) {
                        localStorage.setItem('kemal_user', u);
                        window.location.href = 'oda.html';
                    } else { alert("Hatalı kullanıcı adı veya şifre!"); }
                });
            }
        }
    </script>
</body>
</html>
