<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KEMAL TV | GİRİŞ</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-card">
        <h1>KEMAL TV</h1>
        <div class="tabs">
            <button id="l-tab" class="active" onclick="setMode('login')">GİRİŞ</button>
            <button id="r-tab" onclick="setMode('reg')">KAYIT</button>
        </div>
        <input type="text" id="u" placeholder="Kullanıcı Adı">
        <input type="password" id="p" placeholder="Şifre">
        <button class="main-btn" onclick="auth()">SİSTEME GİR</button>
    </div>
    <script src="auth.js"></script>
</body>
</html>
