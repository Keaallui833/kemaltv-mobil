<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KEMAL TV | ULTIMATE PRO</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
</head>
<body>
    <div id="auth-layer" class="active"></div> <div id="app-layer">
        <div id="stream-bar">
            <input type="text" id="stream-url" placeholder="YouTube Linkini Buraya Yapıştır...">
            <button onclick="updateStream()">YAYINA VER</button>
        </div>

        <div id="video-area">
            <div id="player-container">HDMI Bekleniyor...</div>
        </div>

        <div id="chat-area">
            <div id="messages"></div>
            <div class="bottom-bar">
                <button id="mic-btn" onclick="toggleMic()">🎤</button>
                <input type="text" id="m-input" placeholder="Mesaj yaz...">
                <button id="send-btn" onclick="sendMessage()">GÖNDER</button>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="auth.js"></script>
    <script src="voice.js"></script>
    <script src="app.js"></script>
</body>
</html>
