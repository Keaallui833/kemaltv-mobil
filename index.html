<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KEMAL TV | PRO ODA SİSTEMİ</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <style>
        /* PROFESYONEL CİNEROOM TARZI TASARIM */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #070d19; color: #ffffff; height: 100vh; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        
        .screen { display: none; width: 100%; height: 100%; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .screen.active { display: flex; }

        /* UYGULAMA LOGOSU */
        .app-logo { background: #0066ff; width: 60px; height: 60px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 30px; margin-bottom: 15px; box-shadow: 0 4px 15px rgba(0, 102, 255, 0.4); }
        h1 { font-size: 28px; margin-bottom: 5px; }
        .subtitle { color: #8a99b5; font-size: 14px; margin-bottom: 30px; }

        /* GİRİŞ - KAYIT SEKMELERİ */
        .auth-container { width: 100%; max-width: 350px; }
        .tabs { display: flex; background: #121c2d; border-radius: 12px; padding: 5px; margin-bottom: 20px; }
        .tabs button { flex: 1; padding: 12px; border: none; background: transparent; color: #8a99b5; font-weight: 600; border-radius: 8px; cursor: pointer; transition: 0.3s; }
        .tabs button.active { background: #0066ff; color: white; }

        /* İNPUTLAR VE BUTONLAR */
        .input-group { display: flex; flex-direction: column; gap: 15px; margin-bottom: 25px; }
        input { width: 100%; padding: 16px; border-radius: 12px; border: 1px solid #1e2a42; background: #121c2d; color: white; outline: none; font-size: 14px; }
        input:focus { border-color: #0066ff; }
        .main-btn { width: 100%; padding: 16px; border-radius: 12px; border: none; background: #0066ff; color: white; font-weight: 700; font-size: 16px; cursor: pointer; transition: 0.2s; }
        .main-btn:active { transform: scale(0.98); }
        .guest-link { color: #8a99b5; text-decoration: underline; font-size: 13px; text-align: center; cursor: pointer; display: block; margin-top: 15px; }

        /* HOŞ GELDİN (DASHBOARD) EKRANI */
        .avatar { width: 80px; height: 80px; border-radius: 50%; background: #121c2d; border: 2px solid #0066ff; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: bold; color: #0066ff; margin-bottom: 20px; }
        .status-text { color: #00cc66; font-size: 12px; margin: 15px 0 30px 0; display: flex; align-items: center; gap: 5px; }
        .status-text::before { content: ''; display: inline-block; width: 8px; height: 8px; background: #00cc66; border-radius: 50%; }
        
        .action-buttons { display: flex; gap: 15px; width: 100%; max-width: 350px; }
        .action-buttons button { flex: 1; padding: 16px; border-radius: 12px; border: none; font-weight: 600; cursor: pointer; font-size: 15px; }
        .btn-create { background: #0066ff; color: white; }
        .btn-join { background: #1e2a42; color: white; }

        /* MODAL (POPUP) TASARIMI */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; align-items: flex-end; justify-content: center; z-index: 100; }
        .modal-overlay.active { display: flex; }
        .modal-content { background: #121c2d; width: 100%; max-width: 400px; padding: 25px; border-top-left-radius: 20px; border-top-right-radius: 20px; animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-header h3 { color: #0099ff; font-size: 18px; }
        .close-btn { background: #1e2a42; border: none; color: white; width: 30px; height: 30px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        
        .form-label { display: block; font-size: 12px; color: #8a99b5; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; font-weight: bold; }
        .toggle-row { display: flex; justify-content: space-between; align-items: center; background: #1e2a42; padding: 15px; border-radius: 12px; margin-top: 15px; margin-bottom: 20px; }
        .toggle-row span { font-size: 14px; font-weight: 600; }
        .toggle-row small { display: block; font-size: 11px; color: #8a99b5; margin-top: 3px; }
        
        /* Switch */
        .switch { position: relative; display: inline-block; width: 40px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #070d19; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #0099ff; }
        input:checked + .slider:before { transform: translateX(16px); }

    </style>
</head>
<body>

    <div id="auth-screen" class="screen active">
        <div class="app-logo">🎬</div>
        <h1>Kemal TV v2</h1>
        <p class="subtitle">Film izleme ve sohbet odası</p>
        
        <div class="auth-container">
            <div class="tabs">
                <button id="tab-login" class="active" onclick="setMode('login')">Giriş Yap</button>
                <button id="tab-reg" onclick="setMode('register')">Kayıt Ol</button>
            </div>
            
            <div class="input-group">
                <input type="text" id="disp-name" placeholder="Görünen ad" style="display: none;">
                <input type="text" id="username" placeholder="Kullanıcı adı">
                <input type="password" id="password" placeholder="Şifre (en az 4 karakter)">
            </div>
            
            <button class="main-btn" id="auth-btn" onclick="processAuth()">Giriş Yap</button>
            <span class="guest-link" onclick="loginAsGuest()">Misafir olarak devam et</span>
        </div>
    </div>

    <div id="dashboard-screen" class="screen">
        <div class="avatar" id="user-avatar">KA</div>
        <h2 style="font-size:24px;">Hoş geldin, <span id="display-name-text">Kemal</span>!</h2>
        <p style="color:#8a99b5; margin-top:5px; font-size:15px;">Ne yapmak istersin?</p>
        
        <div class="status-text">Sunucuya bağlandı ✓</div>
        
        <div class="action-buttons">
            <button class="btn-create" onclick="openModal('create-modal')">+ Oda Oluştur</button>
            <button class="btn-join" onclick="openModal('join-modal')">Odaya Katıl</button>
        </div>
        <span class="guest-link" style="margin-top: 30px;" onclick="logOut()">Çıkış Yap</span>
    </div>

    <div id="create-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Yeni Oda Oluştur</h3>
                <button class="close-btn" onclick="closeModals()">✕</button>
            </div>
            
            <label class="form-label">ODA ADI / VİDEO LİNKİ</label>
            <input type="text" id="new-room-link" placeholder="YouTube linkini yapıştır...">
            
            <label class="form-label" style="margin-top:15px;">ŞİFRE (İSTEĞE BAĞLI)</label>
            <input type="text" id="new-room-pass" placeholder="Boş bırakabilirsin">
            
            <div class="toggle-row">
                <div>
                    <span>Kullanıcılar video açabilsin</span>
                    <small>Kapalıysa sadece admin video açar</small>
                </div>
                <label class="switch">
                    <input type="checkbox" id="user-video-toggle" checked>
                    <span class="slider"></span>
                </label>
            </div>
            
            <button class="main-btn" onclick="createRoom()">Odayı Oluştur</button>
        </div>
    </div>

    <div id="join-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Odaya Katıl</h3>
                <button class="close-btn" onclick="closeModals()">✕</button>
            </div>
            
            <label class="form-label">ODA KODU</label>
            <input type="text" id="join-room-code" placeholder="6 HANELİ KOD" style="text-align:center; font-size:20px; letter-spacing: 5px; font-weight:bold;">
            
            <button class="main-btn" style="margin-top: 20px;" onclick="joinRoom()">Odaya Gir</button>
        </div>
    </div>

    <script>
        // FİREBASE BAĞLANTISI BURAYA GELECEK
        const firebaseConfig = {
            apiKey: "AIzaSyC9R9X3FxqgNQ5kWerDmLRSyijbnquoRzg",
            databaseURL: "https://kemaltv-95504-default-rtdb.europe-west1.firebasedatabase.app"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentMode = 'login';
        let activeUser = localStorage.getItem('k_user');
        let activeDisplayName = localStorage.getItem('k_display') || activeUser;

        // Sayfa Yüklendiğinde Kontrol Et
        window.onload = () => {
            if(activeUser) {
                showScreen('dashboard-screen');
                updateDashboardInfo();
            }
        };

        // GİRİŞ / KAYIT SEKMESİ DEĞİŞTİRME
        function setMode(mode) {
            currentMode = mode;
            document.getElementById('tab-login').className = mode === 'login' ? 'active' : '';
            document.getElementById('tab-reg').className = mode === 'register' ? 'active' : '';
            
            document.getElementById('disp-name').style.display = mode === 'register' ? 'block' : 'none';
            document.getElementById('auth-btn').innerText = mode === 'login' ? 'Giriş Yap' : 'Hesap Oluştur';
        }

        // KULLANICI İŞLEMLERİ
        function processAuth() {
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value.trim();
            const d = document.getElementById('disp-name').value.trim();

            if(!u || !p) return alert("Bilgileri doldurmalısın!");

            if(currentMode === 'register') {
                db.ref('users/' + u).set({ p: p, display: d || u }).then(() => {
                    alert("Kayıt başarılı! Şimdi giriş yapabilirsin.");
                    setMode('login');
                });
            } else {
                db.ref('users/' + u).once('value').then(s => {
                    if(s.exists() && s.val().p === p) {
                        localStorage.setItem('k_user', u);
                        localStorage.setItem('k_display', s.val().display || u);
                        location.reload();
                    } else { alert("Hatalı kullanıcı adı veya şifre!"); }
                });
            }
        }

        function loginAsGuest() {
            const guestName = "Misafir_" + Math.floor(Math.random() * 1000);
            localStorage.setItem('k_user', guestName);
            localStorage.setItem('k_display', guestName);
            location.reload();
        }

        function logOut() {
            localStorage.removeItem('k_user');
            localStorage.removeItem('k_display');
            location.reload();
        }

        // DASHBOARD GÜNCELLEME
        function updateDashboardInfo() {
            document.getElementById('display-name-text').innerText = activeDisplayName;
            document.getElementById('user-avatar').innerText = activeDisplayName.substring(0, 2).toUpperCase();
        }

        // EKRAN VE MODAL YÖNETİMİ
        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function openModal(modalId) { document.getElementById(modalId).classList.add('active'); }
        function closeModals() { document.querySelectorAll('.modal-overlay').forEach(el => el.classList.remove('active')); }

        // ODA OLUŞTURMA VE KATILMA SİSTEMİ
        function createRoom() {
            const link = document.getElementById('new-room-link').value;
            const pass = document.getElementById('new-room-pass').value;
            const canUsersChange = document.getElementById('user-video-toggle').checked;
            
            // 6 Haneli Rastgele Kod Oluştur
            const roomCode = Math.floor(100000 + Math.random() * 900000).toString();
            
            db.ref('rooms/' + roomCode).set({
                admin: activeUser,
                videoUrl: link || "",
                password: pass || "",
                allowUserVideo: canUsersChange
            }).then(() => {
                alert("Oda Başarıyla Oluşturuldu! ODA KODUN: " + roomCode + "\n\n(Not: Yayın ekranı bir sonraki güncellemede eklenecektir.)");
                closeModals();
            });
        }

        function joinRoom() {
            const code = document.getElementById('join-room-code').value.trim();
            if(code.length !== 6) return alert("Lütfen 6 haneli kodu girin!");
            
            db.ref('rooms/' + code).once('value').then(s => {
                if(s.exists()) {
                    alert("Odaya Bağlanılıyor... (Yayın ekranı hazırlık aşamasında)");
                    // İleride burası odaya yönlendirecek
                } else { alert("Böyle bir oda bulunamadı!"); }
            });
        }
    </script>
</body>
                </html>
