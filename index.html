<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KEMAL TV - Pro Sistem</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #0b0f1a; color: white; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* Video Oynatıcı */
        #video-container { width: 100%; aspect-ratio: 16/9; background: #000; border-bottom: 2px solid #ef4444; position: relative; }
        iframe { width: 100%; height: 100%; border: none; }
        #status-msg { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #444; font-size: 14px; text-align: center; }

        /* Giriş Ekranı */
        #login-screen { position: fixed; inset: 0; background: #0b0f1a; display: flex; align-items: center; justify-content: center; z-index: 9999; }
        .login-card { background: #161d2f; padding: 30px; border-radius: 20px; width: 85%; max-width: 380px; text-align: center; border: 1px solid #ef4444; box-shadow: 0 0 20px rgba(239, 68, 68, 0.2); }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 10px; border: 1px solid #2d3748; background: #0b0f1a; color: white; outline: none; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-red { background: #ef4444; color: white; }
        .btn-red:hover { background: #dc2626; transform: scale(1.02); }

        /* Sohbet Alanı */
        #chat-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: #0f172a; }
        #messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 8px; }
        .msg { padding: 10px 14px; border-radius: 15px; max-width: 80%; font-size: 14px; position: relative; line-height: 1.4; }
        .msg-other { background: #1e293b; align-self: flex-start; border-bottom-left-radius: 2px; }
        .msg-me { background: #ef4444; align-self: flex-end; border-bottom-right-radius: 2px; }
        .user-tag { font-size: 11px; color: #94a3b8; display: block; margin-bottom: 3px; font-weight: bold; }
        .admin-badge { background: #ffd700; color: #000; font-size: 9px; padding: 2px 6px; border-radius: 5px; margin-right: 5px; }

        /* Alt Kontroller */
        #controls { padding: 12px; background: #161d2f; display: flex; gap: 8px; align-items: center; border-top: 1px solid #2d3748; }
        #mic-btn { width: 50px; height: 50px; border-radius: 50%; border: none; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; font-size: 18px; }
        .mic-off { background: #334155; color: white; }
        .mic-on { background: #10b981; color: white; box-shadow: 0 0 15px #10b981; }
        #msg-input { margin: 0; }
    </style>
</head>
<body>

<div id="login-screen">
    <div class="login-card">
        <h2 style="margin-bottom: 5px;">KEMAL TV</h2>
        <p style="font-size: 12px; color: #94a3b8; margin-bottom: 20px;">Oda & Admin Sistemi Aktif</p>
        <input type="text" id="user-name" placeholder="Adın nedir abi?">
        <input type="text" id="room-id" placeholder="Oda Adı (Örn: tayfa16)">
        <button class="btn btn-red" onclick="joinRoom()">Giriş Yap</button>
    </div>
</div>

<div id="video-container">
    <div id="status-msg">Henüz bir video veya yayın linki atılmadı...</div>
    <div id="player"></div>
</div>

<div id="chat-area">
    <div id="messages"></div>
    <div id="controls">
        <button id="mic-btn" class="mic-off" onclick="toggleMic()">
            <i class="fas fa-microphone-slash"></i>
        </button>
        <input type="text" id="msg-input" placeholder="Mesaj veya YouTube linki...">
        <button class="btn btn-red" style="width:auto; padding: 12px 20px;" onclick="send()">Gönder</button>
    </div>
</div>

<script>
    // Firebase Yapılandırman
    const firebaseConfig = {
        apiKey: "AIzaSyC9R9X3FxqgNQ5kWerDmLRSyijbnquoRzg",
        authDomain: "kemaltv-95504.firebaseapp.com",
        databaseURL: "https://kemaltv-95504-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "kemaltv-95504",
        storageBucket: "kemaltv-95504.firebasestorage.app",
        messagingSenderId: "1061917735137",
        appId: "1:1061917735137:web:5d95ceef5fe479094b9fa0"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let myName, myRoom, micStream;

    function joinRoom() {
        myName = document.getElementById('user-name').value.trim();
        myRoom = document.getElementById('room-id').value.trim().toLowerCase();
        
        if(!myName || !myRoom) return alert("Bilgileri doldurursan süper olur abi!");
        document.getElementById('login-screen').style.display = 'none';

        // Mesajları Dinle
        db.ref('rooms/' + myRoom + '/chats').on('child_added', (snap) => {
            const data = snap.val();
            addMessage(data);
            
            // Link Kontrolü
            if(data.t.includes('youtube.com/watch?v=') || data.t.includes('youtu.be/')) {
                loadVideo(data.t);
            }
        });
    }

    function loadVideo(url) {
        let vid = "";
        if(url.includes('v=')) vid = url.split('v=')[1].split('&')[0];
        else if(url.includes('youtu.be/')) vid = url.split('youtu.be/')[1].split('?')[0];
        
        if(vid) {
            document.getElementById('status-msg').style.display = 'none';
            document.getElementById('player').innerHTML = `<iframe src="https://www.youtube.com/embed/${vid}?autoplay=1" allow="autoplay; fullscreen"></iframe>`;
        }
    }

    function send() {
        const inp = document.getElementById('msg-input');
        if(!inp.value.trim()) return;

        // İsmin Kemal ise Admin yetkisi veriyoruz
        const isAdmin = (myName.toLowerCase() === "kemal");

        db.ref('rooms/' + myRoom + '/chats').push({
            u: myName,
            t: inp.value.trim(),
            admin: isAdmin
        });
        inp.value = "";
    }

    function addMessage(data) {
        const box = document.getElementById('messages');
        const div = document.createElement('div');
        div.className = `msg ${data.u === myName ? 'msg-me' : 'msg-other'}`;
        
        let badge = data.admin ? `<span class="admin-badge">ADMIN</span>` : "";
        div.innerHTML = `<span class="user-tag">${badge}${data.u}</span>${data.t}`;
        
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }

    async function toggleMic() {
        const btn = document.getElementById('mic-btn');
        if(!micStream) {
            try {
                micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                btn.className = "mic-on";
                btn.innerHTML = '<i class="fas fa-microphone"></i>';
            } catch(e) { alert("Mikrofon izni lazım abi!"); }
        } else {
            micStream.getTracks().forEach(track => track.stop());
            micStream = null;
            btn.className = "mic-off";
            btn.innerHTML = '<i class="fas fa-microphone-slash"></i>';
        }
    }

    document.getElementById('msg-input').onkeypress = (e) => { if(e.key === 'Enter') send(); };
</script>

</body>
</html>
