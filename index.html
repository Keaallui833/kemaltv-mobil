<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KEMAL TV | PRO ODA SİSTEMİ</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <style>
        /* Tasarımın Bozulmaması İçin Sabitlenen Stil */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #070d19; color: #ffffff; height: 100vh; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        .screen { display: none; width: 100%; height: 100%; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .screen.active { display: flex; }
        .app-logo { background: #0066ff; width: 60px; height: 60px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 30px; margin-bottom: 15px; box-shadow: 0 4px 15px rgba(0, 102, 255, 0.4); }
        h1 { font-size: 28px; margin-bottom: 5px; }
        .subtitle { color: #8a99b5; font-size: 14px; margin-bottom: 30px; }
        .auth-container { width: 100%; max-width: 350px; }
        .tabs { display: flex; background: #121c2d; border-radius: 12px; padding: 5px; margin-bottom: 20px; }
        .tabs button { flex: 1; padding: 12px; border: none; background: transparent; color: #8a99b5; font-weight: 600; border-radius: 8px; cursor: pointer; }
        .tabs button.active { background: #0066ff; color: white; }
        .input-group { display: flex; flex-direction: column; gap: 15px; margin-bottom: 25px; }
        input { width: 100%; padding: 16px; border-radius: 12px; border: 1px solid #1e2a42; background: #121c2d; color: white; outline: none; }
        .main-btn { width: 100%; padding: 16px; border-radius: 12px; border: none; background: #0066ff; color: white; font-weight: 700; cursor: pointer; }
        .avatar { width: 80px; height: 80px; border-radius: 50%; background: #121c2d; border: 2px solid #0066ff; display: flex; align-items: center; justify-content: center; font-size: 28px; margin-bottom: 20px; }
    </style>
</head>
<body>

    <div id="auth-screen" class="screen active">
        <div class="app-logo">🎬</div>
        <h1>Kemal TV v2</h1>
        <p class="subtitle">Kayıt Ol veya Giriş Yap</p>
        <div class="auth-container">
            <div class="tabs">
                <button id="tab-login" class="active" onclick="setMode('login')">Giriş</button>
                <button id="tab-reg" onclick="setMode('register')">Kayıt</button>
            </div>
            <div class="input-group">
                <input type="text" id="disp-name" placeholder="Adın Soyadın" style="display:none;">
                <input type="text" id="username" placeholder="Kullanıcı Adı">
                <input type="password" id="password" placeholder="Şifre">
            </div>
            <button class="main-btn" onclick="processAuth()">Devam Et</button>
        </div>
    </div>

    <div id="dashboard-screen" class="screen">
        <div class="avatar" id="user-avatar">?</div>
        <h2 id="welcome-text">Hoş geldin!</h2>
        <div style="margin-top:30px; display:flex; gap:10px; width:100%; max-width:350px;">
            <button class="main-btn" onclick="alert('Oda Kodun: ' + Math.floor(Math.random()*900000))">Oda Kur</button>
        </div>
        <p onclick="localStorage.clear(); location.reload();" style="margin-top:20px; color:#8a99b5; cursor:pointer;">Çıkış Yap</p>
    </div>

    <script>
        // SENİN DOĞRU KONFİGÜREASYONUN
        const firebaseConfig = {
            apiKey: "AIzaSyB0jn9kAdRiq8SfLuJwodD8ydrmsmX0nEw",
            authDomain: "kemaltv-e7af9.firebaseapp.com",
            projectId: "kemaltv-e7af9",
            databaseURL: "https://kemaltv-e7af9-default-rtdb.firebaseio.com",
            appId: "1:582115406161:web:b95b2baf91494286886370"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let mode = 'login';
        function setMode(m) {
            mode = m;
            document.getElementById('disp-name').style.display = m === 'register' ? 'block' : 'none';
            document.getElementById('tab-login').className = m === 'login' ? 'active' : '';
            document.getElementById('tab-reg').className = m === 'register' ? 'active' : '';
        }

        function processAuth() {
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value.trim();
            const d = document.getElementById('disp-name').value.trim();

            if(mode === 'register') {
                db.ref('users/' + u).set({ p: p, display: d || u }).then(() => {
                    alert("Kayıt başarılı! Giriş yapabilirsin.");
                    setMode('login');
                });
            } else {
                db.ref('users/' + u).once('value').then(s => {
                    if(s.exists() && s.val().p === p) {
                        localStorage.setItem('user', u);
                        localStorage.setItem('name', s.val().display || u);
                        showDash();
                    } else { alert("Kullanıcı bulunamadı veya şifre yanlış!"); }
                });
            }
        }

        function showDash() {
            const name = localStorage.getItem('name');
            document.getElementById('welcome-text').innerText = "Hoş geldin, " + name + "!";
            document.getElementById('user-avatar').innerText = name.substring(0,2).toUpperCase();
            document.getElementById('auth-screen').className = 'screen';
            document.getElementById('dashboard-screen').className = 'screen active';
        }

        if(localStorage.getItem('user')) showDash();
    </script>
</body>
</html>
