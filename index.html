<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kemal TV - Canlı Yayın</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: #0f172a; color: white; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }

        /* KEMAL TV LOGO ALANI */
        header { padding: 15px; background: #1e293b; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #ef4444; }
        .logo { font-size: 1.4rem; font-weight: 800; color: #fff; text-transform: uppercase; letter-spacing: 1px; }
        .logo span { color: #ef4444; text-shadow: 0 0 10px #ef4444; }

        /* VİDEO PLAYER (16:9) */
        #video-container { width: 100%; aspect-ratio: 16/9; background: #000; position: relative; }
        iframe { width: 100%; height: 100%; border: none; }

        /* SOHBET AKIŞI */
        #chat { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 8px; background: #0f172a; }
        .msg { padding: 10px 14px; border-radius: 15px; font-size: 14px; max-width: 85%; }
        .msg.admin { background: #ef4444; align-self: flex-start; border-bottom-left-radius: 2px; }
        .msg.user { background: #334155; align-self: flex-end; border-bottom-right-radius: 2px; }
        .username { font-size: 10px; font-weight: bold; opacity: 0.8; margin-bottom: 2px; display: block; }

        /* ALT KONTROL BARI */
        #controls { padding: 10px 15px; background: #1e293b; display: flex; gap: 10px; align-items: center; padding-bottom: 25px; }
        #mic-btn { width: 50px; height: 50px; border-radius: 50%; border: none; background: #334155; color: white; display: flex; align-items: center; justify-content: center; transition: 0.3s; }
        #mic-btn.active { background: #ef4444; box-shadow: 0 0 15px #ef4444; }
        
        .input-wrapper { flex: 1; position: relative; }
        input { width: 100%; background: #0f172a; border: 1px solid #334155; border-radius: 25px; padding: 12px 45px 12px 15px; color: white; outline: none; }
        #send-btn { position: absolute; right: 10px; top: 8px; background: none; border: none; color: #ef4444; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <div class="logo">KEMAL <span>TV</span></div>
        <div id="viewer-count" style="font-size: 12px; color: #94a3b8;"><i data-lucide="eye" style="width:14px; vertical-align:middle;"></i> 1.2k</div>
    </header>

    <div id="video-container">
        <iframe id="player" src="https://www.youtube.com/embed/live_stream?channel=UC..." allowfullscreen></iframe>
    </div>

    <div id="chat">
        <div class="msg admin">
            <span class="username">KEMAL (Sistem)</span>
            Kemal TV'ye hoş geldin! Yayın birazdan başlayacak.
        </div>
    </div>

    <div id="controls">
        <button id="mic-btn"><i data-lucide="mic-off"></i></button>
        <div class="input-wrapper">
            <input type="text" id="msg-input" placeholder="Mesaj yaz...">
            <button id="send-btn"><i data-lucide="send"></i></button>
        </div>
    </div>

    <script>
        lucide.createIcons();
        
        // MİKROFON SİSTEMİ
        const micBtn = document.getElementById('mic-btn');
        let isMicOn = false;

        micBtn.addEventListener('click', async () => {
            if(!isMicOn) {
                try {
                    await navigator.mediaDevices.getUserMedia({ audio: true });
                    isMicOn = true;
                    micBtn.classList.add('active');
                    micBtn.innerHTML = '<i data-lucide="mic"></i>';
                } catch(e) { alert("Mikrofon izni gerekli!"); }
            } else {
                isMicOn = false;
                micBtn.classList.remove('active');
                micBtn.innerHTML = '<i data-lucide="mic-off"></i>';
            }
            lucide.createIcons();
        });

        // MESAJ GÖNDERME (GÖRSEL)
        document.getElementById('send-btn').onclick = () => {
            const input = document.getElementById('msg-input');
            if(!input.value) return;
            const chat = document.getElementById('chat');
            chat.innerHTML += `<div class="msg user"><span class="username">Sen</span>${input.value}</div>`;
            input.value = "";
            chat.scrollTop = chat.scrollHeight;
        };
    </script>
</body>
</html>
